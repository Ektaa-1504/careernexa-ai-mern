services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careernexa-backend-container
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ./server/.env

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: careernexa-frontend-container
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
